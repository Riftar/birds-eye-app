[project]
name = "birds-eye"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic-settings>=2.7", "httpx>=0.27", "uvicorn>=0.34"]

[project.optional-dependencies]
deploy = ["modal>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
